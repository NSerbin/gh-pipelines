name: Terraform Checks

on:
  workflow_call:
    inputs:
      terraform_version:
        required: true
        type: string
        default: 1.9.6
      require_pg_backend:
        description: "Require PG_CONN_STR to initialize Terraform pg backend"
        required: false
        type: boolean
        default: false

jobs:
  terraform_checks:
    name: Terraform Checks
    runs-on: gh-arc-dind
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.1
        with:
          fetch-depth: 0
          ref: "${{ github.head_ref || github.ref }}"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ inputs.terraform_version }}
      - name: Export secret as env
        if: ${{ env.secret != 'null' }}
        run: echo "$secret" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> $GITHUB_ENV
        env:
          secret: ${{ toJson(secrets) }}
      - name: Export vars as env
        if: ${{ env.var != 'null' }}
        env:
          var: ${{ toJson(vars) }}
        run: echo "$var" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> $GITHUB_ENV
      - name: Verify PostgreSQL backend config
        if: ${{ inputs.require_pg_backend }}
        run: |
          set -euo pipefail
          if [ -z "${PG_CONN_STR:-}" ]; then
            echo "PG_CONN_STR is required for the Terraform pg backend"
            exit 1
          fi
      - name: Terraform Init
        id: init
        run: terraform init -input=false
      - name: Terraform Format
        id: fmt
        run: terraform fmt -recursive -diff -write=true
        continue-on-error: true
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Commit Terraform FMT Changes
        if: ${{ steps.fmt.outcome == 'success' }}      
        id: auto-commit-action
        uses: stefanzweifel/git-auto-commit-action@v5.0.1
        with:
          commit_message: "Auto-format Terraform files"
